<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>HomeHunt</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1D3860"/>
      <stop offset="1" stop-color="#0C1730"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#tile)"/>
  <g transform="translate(-4 -22)">
    <!-- La casa es el lente de la lupa ("Home", blanco) -->
    <path d="M90 214 L210 98 L330 214 L330 360 L90 360 Z"
          fill="#FFFFFF" fill-opacity="0.09"
          stroke="#F4F7FB" stroke-width="46" stroke-linejoin="round"/>
    <!-- Mango de la lupa ("Hunt", azul) -->
    <path d="M358 388 L426 456" stroke="#5B9BE8" stroke-width="58" stroke-linecap="round"/>
  </g>
</svg>
